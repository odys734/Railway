<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0F1E46" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Speed tracks / Perspective railway lines -->
  <path d="M120 440 L220 310 L292 310 L392 440 Z" fill="url(#glowGrad)" />
  <line x1="80" y1="440" x2="225" y2="310" stroke="#00E5FF" stroke-width="3.5" stroke-opacity="0.7" />
  <line x1="432" y1="440" x2="287" y2="310" stroke="#00E5FF" stroke-width="3.5" stroke-opacity="0.7" />
  <!-- Railway ties / sleepers -->
  <line x1="130" y1="420" x2="382" y2="420" stroke="#00E5FF" stroke-width="3" stroke-opacity="0.5" />
  <line x1="165" y1="385" x2="347" y2="385" stroke="#00E5FF" stroke-width="2.5" stroke-opacity="0.4" />
  <line x1="195" y1="350" x2="317" y2="350" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.3" />

  <!-- Aerodynamic Bullet Locomotive Body -->
  <!-- Nose cone and cabin -->
  <path d="M256 96 C216 96 178 136 172 200 L164 290 C162 312 178 328 200 328 L312 328 C334 328 350 312 348 290 L340 200 C334 136 296 96 256 96 Z" 
        fill="url(#trainGrad)" />

  <!-- Electric teal cockpit panoramic windshield -->
  <path d="M256 128 C232 128 204 148 198 184 L190 220 C188 228 196 236 206 236 L306 236 C316 236 324 228 322 220 L314 184 C308 148 280 128 256 128 Z" 
        fill="#0A1128" stroke="#00E5FF" stroke-width="3.5" />

  <!-- Center AI Node Core in windshield -->
  <circle cx="256" cy="182" r="10" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="256" cy="182" r="4" fill="#FFFFFF" />

  <!-- Locomotive aerodynamic vents & details -->
  <rect x="220" y="254" width="72" height="10" rx="5" fill="#0A1128" opacity="0.8" />
  <rect x="228" y="272" width="56" height="8" rx="4" fill="#0A1128" opacity="0.8" />

  <!-- High-beam Headlights (Dual Electric Teal Halos) -->
  <circle cx="196" cy="304" r="12" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="196" cy="304" r="6" fill="#FFFFFF" />
  
  <circle cx="316" cy="304" r="12" fill="#00E5FF" filter="url(#glow)" />
  <circle cx="316" cy="304" r="6" fill="#FFFFFF" />

  <!-- AI Neural Network overlay arcs & book wings -->
  <!-- Left wing/arc -->
  <path d="M140 220 C110 230 84 260 84 290 C84 320 114 340 148 335" 
        fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="84" cy="290" r="6" fill="#00E5FF" />
  <circle cx="140" cy="220" r="5" fill="#00E5FF" />

  <!-- Right wing/arc -->
  <path d="M372 220 C402 230 428 260 428 290 C428 320 398 340 364 335" 
        fill="none" stroke="url(#tealGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="428" cy="290" r="6" fill="#00E5FF" />
  <circle cx="372" cy="220" r="5" fill="#00E5FF" />

  <!-- Crown knowledge / achievement diamond spark -->
  <path d="M256 52 L266 76 L290 86 L266 96 L256 120 L246 96 L222 86 L246 76 Z" 
        fill="#00E5FF" filter="url(#glow)" />
</svg>
